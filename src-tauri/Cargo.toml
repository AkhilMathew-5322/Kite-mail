[package]
name = "kitemail"
version = "0.2.0"
description = "Lightweight desktop email client (IMAP/SMTP, Microsoft 365 & Gmail OAuth)"
edition = "2021"

[lib]
name = "kitemail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Mail
imap = "2.4"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
mail-parser = "0.9"

# Storage / secrets
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

# OAuth helpers
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
chrono = "0.4"
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Android has no system OpenSSL: build it from source for IMAP/SMTP TLS.
[target.'cfg(target_os = "android")'.dependencies]
native-tls = { version = "0.2", features = ["vendored"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
