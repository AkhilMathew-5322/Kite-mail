name: Build Kite Mail

permissions:
  contents: write   # needed to publish GitHub Releases on version tags

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]   # creating a Release on github.com builds and attaches the installers
  workflow_dispatch:

jobs:
  audit:
    # Fails the build on any known vulnerability or new unmaintained/unsound crate.
    # Reviewed exceptions (upstream Tauri/imap dependencies) live in src-tauri/.cargo/audit.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: kitemail-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  # Experimental until Phase 2 (mobile-tuned screens + QR pairing).
  android:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK + NDK; use them instead of downloading.
      - name: Locate Android SDK / NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" | tail -3
      # OpenSSL (vendored, for IMAP/SMTP TLS) expects GNU-style tool names; newer NDKs only ship llvm-*.
      - name: NDK tool aliases for OpenSSL build
        run: |
          TB="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p "$HOME/ndk-alias"
          for t in aarch64-linux-android armv7a-linux-androideabi arm-linux-androideabi x86_64-linux-android i686-linux-android; do
            for tool in ar ranlib nm strip; do ln -sf "$TB/llvm-$tool" "$HOME/ndk-alias/$t-$tool"; done
          done
          echo "$HOME/ndk-alias" >> "$GITHUB_PATH"
          echo "$TB" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Generate Android project
        run: cargo tauri android init --ci
      - name: Use Kite Mail's MainActivity (status bar / navigation bar / keyboard insets)
        run: |
          F=$(find src-tauri/gen/android -name MainActivity.kt | head -1)
          echo "Replacing $F"
          cp src-tauri/android/MainActivity.kt "$F"
      - name: Kite Mail launcher icons (adaptive, round, themed)
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          find "$RES" -name 'ic_launcher*' -delete
          cp -r src-tauri/android/res/. "$RES/"
          ls "$RES"/mipmap-anydpi-v26
      # Always an optimised release build (stripped, LTO, size-optimised Rust; R8-shrunk Java) –
      # a debug build is ~10x bigger. Signed with your key when the secrets are set (see README);
      # otherwise with a throw-away key made for this build (installs fine, but each such build
      # must replace the previous one by uninstalling it first).
      - name: Build APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p dist
          cargo tauri android build --apk --target aarch64
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            OUT="dist/KiteMail-${GITHUB_REF_NAME}-android-arm64.apk"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret – signing with a temporary key (see README → Android signing)"
            KS_PASS=$(openssl rand -hex 16); KS_ALIAS=kitemail
            keytool -genkeypair -keystore ks.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Kite Mail test build" >/dev/null
            OUT="dist/KiteMail-${GITHUB_REF_NAME}-android-arm64-testkey.apk"
          fi
          KS_PASS="$KS_PASS" "$BT/apksigner" sign --ks ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out "$OUT" aligned.apk
          rm -f ks.jks aligned.apk
          "$BT/apksigner" verify "$OUT"
          ls -la dist
          unzip -lv "$OUT" | sort -k1 -n -r | head -6
      - uses: actions/upload-artifact@v7
        with:
          name: kitemail-android
          path: dist/*.apk

  # Push a tag like v0.3.0 -> a GitHub Release with every installer attached (permanent links).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir release
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.apk' \) -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
